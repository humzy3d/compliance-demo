name: compliance-iac-policy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opa:
    name: IaC policy (OPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
      - name: Convert infra/ Terraform to JSON
        run: |
          python -m pip install --disable-pip-version-check "python-hcl2~=4.3"
          python - <<'EOF'
          import glob, json
          import hcl2

          merged = {"resource": [], "data": [], "module": []}
          for path in sorted(glob.glob("infra/**/*.tf", recursive=True)):
              if "/.terraform/" in path:
                  continue
              with open(path) as f:
                  doc = hcl2.load(f)
              for key in merged:
                  merged[key].extend(doc.get(key, []))
          with open("tfconfig.json", "w") as out:
              json.dump(merged, out, indent=2, default=str)
          print(f"resources blocks: {len(merged['resource'])}")
          EOF
      - name: Test policies
        run: opa test policy/terraform -v
      - name: Enforce policies
        run: |
          opa eval --fail-defined --format pretty \
            -d policy/terraform -i tfconfig.json \
            'data.terraform.baseline.deny[x]'
