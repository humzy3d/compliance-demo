name: compliance-sast
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
          # Code scanning upload needs a public repo or GitHub Advanced Security.
          # SARIF is always kept as an artifact, so evidence exists either way.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}

      - name: Keep SARIF as evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          retention-days: 90

      - name: Fail on error-level findings
        shell: bash
        run: |
          count=$(jq '[.runs[].results[]? | select(.level == "error")] | length' sarif-results/*.sarif | awk '{s+=$1} END {print s+0}')
          echo "CodeQL error-level findings: ${count}"
          if [ "${count}" -gt 0 ]; then
            jq -r '.runs[].results[]? | select(.level == "error") | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' sarif-results/*.sarif
            exit 1
          fi
