name: compliance-sast
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: "/language:${{ matrix.language }}"

  bandit:
    name: Bandit (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: python -m pip install --upgrade "bandit[sarif]"
      - name: Run Bandit (fail on medium+ severity and confidence)
        run: |
          bandit -r . -x ./.git,./.venv,./venv,./tests,./test \
            --severity-level medium --confidence-level medium \
            -f sarif -o bandit.sarif || status=$?
          bandit -r . -x ./.git,./.venv,./venv,./tests,./test \
            --severity-level medium --confidence-level medium -f screen || true
          exit ${status:-0}
      - name: Keep Bandit SARIF as evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit-sarif
          path: bandit.sarif
          if-no-files-found: warn
          retention-days: 90
