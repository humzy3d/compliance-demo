# Added by compliance-agents. Gate: gate.iac-scan (objective: iac-scan)
# Controls: FedRAMP KSI-MLA-EVC, KSI-SVC-ACM | CSA CCM CCC-06, CCC-07 | PCI DSS 2.2.1
name: compliance-iac-scan
on:
  pull_request:
    paths: ["**/*.tf", "**/*.tfvars"]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checkov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bridgecrewio/checkov-action@3f0caf0c3aa9f56ade6b49f6e60b63aaeafb75a3 # v12.3141.0
        with:
          directory: infra
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: results.sarif
