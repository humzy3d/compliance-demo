# Added by compliance-agents. Gate: gate.secrets-scan (objective: secrets-scan)
# Controls: FedRAMP KSI-SVC-ASM | CSA CCM IAM-15 | PCI DSS 8.6.2
name: compliance-secrets-scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          version: 3.99.9
          extra_args: --results=verified,unknown
