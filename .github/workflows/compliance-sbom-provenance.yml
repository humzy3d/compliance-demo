# Added by compliance-agents. Gate: gate.sbom-provenance (objective: sbom-provenance)
# Controls: FedRAMP KSI-SVC-VRI, KSI-PIY-GIV | CSA CCM AIS-06 | PCI DSS 6.3.2
#
# TODO(owner): point `subject-path` at your real release artifacts (binaries, packages)
# or switch to `subject-name`/`subject-digest` for container images.
name: compliance-sbom-provenance
on:
  push:
    branches: [main]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom.spdx.json
