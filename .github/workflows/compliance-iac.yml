name: compliance-iac
on:
  pull_request:
    paths: ["infra/**", "policy/**", ".github/workflows/compliance-iac.yml"]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checkov:
    name: IaC misconfiguration scan (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@3f0caf0c3aa9f56ade6b49f6e60b63aaeafb75a3 # v12
        with:
          directory: infra
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: false
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('results.sarif') != ''
        continue-on-error: true   # code scanning may be unavailable on this plan; artifact below is the fallback
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: results.sarif
          category: checkov-terraform
      - name: Keep SARIF as artifact
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkov-sarif
          path: results.sarif
          retention-days: 90
  conftest:
    name: Policy-as-code (Conftest/OPA)
    runs-on: ubuntu-latest
    env:
      CONFTEST_VERSION: "0.56.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install conftest
        run: |
          curl -sSfL -o /tmp/conftest.tgz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/conftest.tgz -C /tmp conftest
          sudo install /tmp/conftest /usr/local/bin/conftest
      - name: Conftest policy check on infra/
        run: |
          conftest test --parser hcl2 --policy policy/terraform --namespace terraform.baseline --all-namespaces=false infra/
